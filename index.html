<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLPED · OC · Stock — Mantenimiento</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1d2330; --ink2:#5b6475; --line:#e3e6ec; --soft:#f0f2f6;
  --brand:#3b2a6b; --brand2:#6a4fb3; --accent:#2f6fde;
  --good:#1f8a4c; --warn:#c98a00; --bad:#c43c3c; --info:#2f6fde;
  --r:12px; --sh:0 1px 2px rgba(20,24,40,.06),0 2px 8px rgba(20,24,40,.04);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
header{background:var(--brand);color:#fff;padding:14px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
header .sub{font-size:12px;opacity:.8}
header .sp{flex:1}
.hbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.22)}
nav{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--ink2);border-bottom:2px solid transparent;white-space:nowrap}
nav button.on{color:var(--brand);border-bottom-color:var(--brand2);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);align-items:flex-end}
.filters label{display:flex;flex-direction:column;font-size:11px;color:var(--ink2);gap:3px}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;min-width:120px}
.filters .clr{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 12px;cursor:pointer}
main{padding:20px 24px 48px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:14px}
.k6{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.c2{grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr))}
.c3{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.card h3{margin:0 0 2px;font-size:14px;font-weight:650}
.card .note{font-size:12px;color:var(--ink2);margin:0 0 10px}
.kpi{position:relative;padding:14px 16px 12px}
.kpi .lbl{font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;align-items:flex-start;gap:6px}.kpi .lbl .pill{flex-shrink:0;line-height:1.5}
.kpi .val{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.3px}
.kpi .det{font-size:12px;color:var(--ink2)}
.kpi .bar{position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
.kpi.good .bar{background:var(--good)} .kpi.warn .bar{background:var(--warn)} .kpi.bad .bar{background:var(--bad)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.pill.good{background:#e5f4ec;color:var(--good)} .pill.warn{background:#fbf1d9;color:#9a6a00} .pill.bad{background:#f9e3e3;color:var(--bad)}
.sec{margin:22px 0 10px;font-size:13px;font-weight:650;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px}
.chart{position:relative;height:280px}
.chart.tall{height:360px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--ink2);background:var(--soft);position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.st{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.st-SIN{background:#f9e3e3;color:#a12f2f} .st-POR{background:#fde9d6;color:#a65300} .st-TRA{background:#fbf1d9;color:#8a6200}
.st-PAR{background:#e3edfc;color:#2457b3} .st-ATE{background:#e5f4ec;color:#1f7a45}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tools input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:240px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.muted{color:var(--ink2)}
.empty{padding:28px;text-align:center;color:var(--ink2)}
.alert{border-left:4px solid var(--warn);background:#fffaf0;padding:10px 14px;border-radius:8px;margin-bottom:10px}
.alert.bad{border-color:var(--bad);background:#fff5f5}
.alert.info{border-color:var(--info);background:#f3f7ff}
.hide{display:none!important}
#overlay{position:fixed;inset:0;background:rgba(20,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#overlay .box{background:#fff;border-radius:14px;padding:22px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.2)}
#overlay label{display:block;font-size:12px;color:var(--ink2);margin:12px 0 4px}
#overlay input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(245,246,248,.8);z-index:40;font-weight:600;color:var(--brand)}
#dt td{white-space:nowrap}#dt td:nth-child(5),#dt td:nth-child(16){white-space:normal;min-width:200px}
.ms{position:relative}.ms-pan{position:absolute;z-index:30;top:calc(100% + 4px);left:0;width:280px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,24,40,.15);padding:8px}
.ms-pan input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px}.ms-act{display:flex;gap:6px;margin:6px 0}.ms-act .btn{padding:3px 10px;font-size:12px}
.ms-list{max-height:260px;overflow:auto}.ms-list input{min-width:0!important;width:auto;margin:0}#ct td{white-space:nowrap}#ct td:nth-child(2),#ct td:nth-child(4),#ct td:nth-child(8){white-space:normal;min-width:160px}.ms-list label{display:flex;gap:6px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}.ms-list label:hover{background:var(--soft)}.ms-list label span:first-of-type{flex:1}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;margin-top:8px;font-size:12px}
@media (max-width:640px){header,nav,.filters,main{padding-left:16px;padding-right:16px}.kpi .val{font-size:22px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Seguimiento SOLPED · OC · Ingreso · Stock</h1>
    <div class="sub" id="hdrSub">Mantenimiento — HFE Berries Olmos</div>
  </div>
  <div class="sp"></div>
  <span class="sub" id="hdrFecha"></span>
  <button class="hbtn" id="btnRecargar" title="Volver a leer los datos">Actualizar</button>
  <button class="hbtn" id="btnConfig" title="URL de la API y clave">Configuración</button>
</header>
<nav id="tabs">
  <button data-t="resumen" class="on">Resumen</button>
  <button data-t="compras">Compras</button>
  <button data-t="abast">Abastecimiento</button>
  <button data-t="prov">Proveedores</button>
  <button data-t="inv">Inventario</button>
  <button data-t="detalle">Detalle</button>
  <button data-t="costos">Historial de costos</button>
  <button data-t="calidad">Calidad de datos</button>
</nav>
<div class="filters" id="filters">
  <label>Área<select id="fArea"></select></label>
  <label>Tipo<select id="fTipo"></select></label>
  <label>Estado<select id="fEstado"></select></label>
  <label>Gasto<select id="fGasto"></select></label>
  <label>Urgencia<select id="fUrg"></select></label>
  <label>Comprador<select id="fComp"></select></label>
  <label>Solicitante<select id="fSol"></select></label>
  <label>Solicitud desde<input type="date" id="fDesde"></label>
  <label>hasta<input type="date" id="fHasta"></label>
  <button class="clr" id="btnLimpiar">Limpiar filtros</button>
  <span class="muted" id="fNota" style="font-size:12px;align-self:center"></span>
</div>
<main id="app">
  <section data-p="resumen"></section>
  <section data-p="compras" class="hide"></section>
  <section data-p="abast" class="hide"></section>
  <section data-p="prov" class="hide"></section>
  <section data-p="inv" class="hide"></section>
  <section data-p="detalle" class="hide"></section>
  <section data-p="costos" class="hide"></section>
  <section data-p="calidad" class="hide"></section>
</main>

<div id="overlay" class="hide">
  <div class="box">
    <h3 style="margin:0 0 4px">Conectar con Google Sheets</h3>
    <p class="muted" style="margin:0;font-size:13px">Pegue la URL de la Web App de Apps Script (termina en <code>/exec</code>) y la clave definida en la hoja CONFIG. Se guardan solo en este navegador.</p>
    <label for="inUrl">URL de la Web App</label>
    <input id="inUrl" placeholder="https://script.google.com/macros/s/.../exec">
    <label for="inClave">Clave de acceso</label>
    <input id="inClave" type="password" placeholder="CLAVE_ACCESO">
    <p id="cfgErr" class="alert bad hide" style="margin-top:12px"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn" id="btnCfgCancel">Cancelar</button>
      <button class="btn pri" id="btnCfgOk">Conectar</button>
    </div>
  </div>
</div>
<div id="loading" class="hide">Cargando datos…</div>

<script>
/* =====================================================================
   CONFIGURACIÓN
   API_URL_POR_DEFECTO: puede dejar aquí la URL de la Web App para que
   nadie tenga que pegarla. La CLAVE nunca se escribe en este archivo
   (GitHub Pages es público): cada usuario la ingresa una vez.
   ===================================================================== */
const API_URL_POR_DEFECTO = 'https://script.google.com/macros/s/AKfycbwaDsKN0PP-vaawdxyL-TGg4MGFBnvneBkjEJKFI_tmq6tr4kOkuXB7ImSr1ETn5cl1/exec';
const LS = { url: 'solped_api_url', clave: 'solped_api_clave', cache: 'solped_cache_v1', tab: 'solped_tab' };

const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------------------------- Estado ---------------------------- */
let MAT = new Map(), DATA = null, POS = [], STK = [], CONS = [], META = {}, FILT = [];
const charts = {};
const $ = s => document.querySelector(s);
const ESTADOS = ['SIN OC/OS', 'OC POR LIBERAR', 'EN TRANSITO', 'PARCIAL', 'ATENDIDO'];
const EST_COLOR = { 'SIN OC/OS': '#c43c3c', 'OC POR LIBERAR': '#e07b1a', 'EN TRANSITO': '#d9a400', 'PARCIAL': '#2f6fde', 'ATENDIDO': '#1f8a4c' };
const PAL = ['#3b2a6b', '#2f6fde', '#1f8a4c', '#e07b1a', '#8b5cc7', '#0f9aa8', '#c43c3c', '#7a8597', '#b8860b', '#d16ba5'];

/* ---------------------------- Formatos ---------------------------- */
const nf0 = new Intl.NumberFormat('es-PE', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('es-PE', { maximumFractionDigits: 1 });
const fN = v => v == null || isNaN(v) ? '—' : nf0.format(v);
const fD = v => v == null || isNaN(v) ? '—' : nf1.format(v) + ' d';
const fP = v => v == null || isNaN(v) ? '—' : nf1.format(v * 100) + '%';
const fS = v => {
  if (v == null || isNaN(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e6) return 'S/ ' + nf1.format(v / 1e6) + ' M';
  if (a >= 1e3) return 'S/ ' + nf1.format(v / 1e3) + ' mil';
  return 'S/ ' + nf0.format(v);
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stCls = e => 'st st-' + String(e).replace('SIN OC/OS', 'SIN').replace('OC POR LIBERAR', 'POR').replace('EN TRANSITO', 'TRA').replace('PARCIAL', 'PAR').replace('ATENDIDO', 'ATE');

/* ---------------------------- Estadística ---------------------------- */
const vals = (a, k) => a.map(r => r[k]).filter(v => v != null && v !== '' && !isNaN(v));
function quant(arr, q) {
  if (!arr.length) return null;
  const s = [...arr].sort((a, b) => a - b), p = (s.length - 1) * q, b = Math.floor(p);
  return s[b + 1] !== undefined ? s[b] + (p - b) * (s[b + 1] - s[b]) : s[b];
}
const med = a => quant(a, .5), p90 = a => quant(a, .9);
const sum = (a, k) => a.reduce((t, r) => t + (Number(r[k]) || 0), 0);
function groupBy(a, f) { const m = new Map(); a.forEach(r => { const k = typeof f === 'function' ? f(r) : r[f]; if (!m.has(k)) m.set(k, []); m.get(k).push(r); }); return m; }
function semaforo(v, meta, mayorEsMejor) {
  if (v == null || meta == null || isNaN(v)) return '';
  if (mayorEsMejor) return v >= meta ? 'good' : (v >= meta * 0.9 ? 'warn' : 'bad');
  return v <= meta ? 'good' : (v <= meta * 1.3 ? 'warn' : 'bad');
}
const M = k => (META.metas || {})[k];

/* ---------------------------- Carga de datos ---------------------------- */
function apiUrl() { return ls.get(LS.url) || API_URL_POR_DEFECTO; }

function jsonp(url) {
  return new Promise((ok, ko) => {
    const cb = '__cb' + Date.now(), s = document.createElement('script');
    const t = setTimeout(() => { delete window[cb]; s.remove(); ko(new Error('Tiempo de espera agotado')); }, 60000);
    window[cb] = d => { clearTimeout(t); delete window[cb]; s.remove(); ok(d); };
    s.onerror = () => { clearTimeout(t); delete window[cb]; ko(new Error('No se pudo conectar')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.body.appendChild(s);
  });
}

async function pedirDatos(url, clave) {
  const u = url + '?clave=' + encodeURIComponent(clave);
  let d;
  try {
    const r = await fetch(u, { redirect: 'follow' });
    d = await r.json();
  } catch (e) {
    d = await jsonp(u);
  }
  if (d && d.error) throw new Error(d.error === 'CLAVE_INVALIDA' ? 'Clave inválida.' : (d.detalle || d.error));
  if (!d || !d.pos) throw new Error('Respuesta sin datos.');
  return d;
}

async function cargar(forzar) {
  if (window.DEMO_DATA) { iniciar(window.DEMO_DATA); return; }
  const url = apiUrl(), clave = ls.get(LS.clave);
  if (!url || !clave) { abrirConfig(); return; }
  if (!forzar) {
    const c = ls.get(LS.cache);
    if (c) { try { iniciar(JSON.parse(c)); } catch (e) {} }
  }
  $('#loading').classList.remove('hide');
  try {
    const d = await pedirDatos(url, clave);
    ls.set(LS.cache, JSON.stringify(d));
    iniciar(d);
  } catch (e) {
    if (!DATA) { abrirConfig(e.message); }
    else aviso('No se pudo actualizar: ' + e.message + ' Se muestran los últimos datos guardados.');
  } finally { $('#loading').classList.add('hide'); }
}

function aviso(t) {
  const s = document.querySelector('section[data-p="resumen"]');
  s.insertAdjacentHTML('afterbegin', `<div class="alert bad">${esc(t)}</div>`);
}

function abrirConfig(err) {
  $('#inUrl').value = apiUrl() || '';
  $('#inClave').value = ls.get(LS.clave) || '';
  $('#cfgErr').classList.toggle('hide', !err);
  $('#cfgErr').textContent = err || '';
  $('#overlay').classList.remove('hide');
}
$('#btnConfig').onclick = () => abrirConfig();
$('#btnCfgCancel').onclick = () => $('#overlay').classList.add('hide');
$('#btnCfgOk').onclick = async () => {
  const url = $('#inUrl').value.trim(), clave = $('#inClave').value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { abrirConfig('La URL debe ser de script.google.com y terminar en /exec.'); return; }
  ls.set(LS.url, url); ls.set(LS.clave, clave);
  $('#overlay').classList.add('hide');
  cargar(true);
};
$('#btnRecargar').onclick = () => cargar(true);

/* ---------------------------- Inicio ---------------------------- */
function aObjetos(t) { return (t && t.rows || []).map(r => { const o = {}; t.cols.forEach((c, i) => o[c] = r[i]); return o; }); }

function iniciar(d) {
  DATA = d; META = d.meta || {};
  POS = aObjetos(d.pos); STK = aObjetos(d.stock); CONS = aObjetos(d.consumo);
  MAT = new Map(((d.matArea && d.matArea.rows) || []).map(r => [String(r[0]), String(r[1] || '').split('|').filter(Boolean)]));
  const per = META.periodo || {};
  $('#hdrFecha').textContent = 'Datos al ' + (META.fechaCorte || '—') + (META.corteOrigen === 'CONFIG' ? ' (fijado en CONFIG)' : '') + ' · procesado ' + (META.generado || '—');
  $('#hdrSub').textContent = 'Mantenimiento — ' + fN(POS.length) + ' posiciones · SOLPED del ' + (per.desde || META.fechaDesde || '—') + ' al ' + (per.hasta || META.fechaCorte || '—');
  aplicar();
}

function opciones(sel, entradas, todos) {
  const prev = sel.value;
  if (prev && !entradas.some(e => e[0] === prev)) entradas.push([prev, 0]);
  sel.innerHTML = `<option value="">${todos}</option>` + entradas.map(([v, n]) => `<option value="${esc(v)}">${esc(v)} (${fN(n)})</option>`).join('');
  sel.value = prev;
}
function estadoFiltros() {
  const f = {}; Object.entries(FMAP).forEach(([id, k]) => { const v = $('#' + id).value; if (v) f[k] = v; });
  return { f, de: $('#fDesde').value, ha: $('#fHasta').value };
}
function cumple(r, st, excepto) {
  for (const k in st.f) if (k !== excepto && (r[k] || '(vacío)') !== st.f[k]) return false;
  if (st.de && r.fSol < st.de) return false;
  if (st.ha && r.fSol > st.ha) return false;
  return true;
}
/* Filtros en cascada: cada lista muestra solo los valores que existen con los demás filtros aplicados */
function llenarFiltros() {
  const st = estadoFiltros();
  const lista = (k, orden) => {
    const c = {}; POS.forEach(r => { if (cumple(r, st, k)) { const v = r[k] || '(vacío)'; c[v] = (c[v] || 0) + 1; } });
    const ks = orden ? orden.filter(v => c[v]) : Object.keys(c).sort((a, b) => c[b] - c[a] || a.localeCompare(b));
    return ks.map(v => [v, c[v]]);
  };
  opciones($('#fArea'), lista('area'), 'Todas');
  opciones($('#fTipo'), lista('tipo'), 'Todos');
  opciones($('#fEstado'), lista('estado', ESTADOS), 'Todos');
  opciones($('#fGasto'), lista('gasto'), 'OPEX y CAPEX');
  opciones($('#fUrg'), lista('urgencia'), 'Todas');
  opciones($('#fComp'), lista('comprador'), 'Todos');
  opciones($('#fSol'), lista('solicitante'), 'Todos');
}
const FMAP = { fArea: 'area', fTipo: 'tipo', fEstado: 'estado', fGasto: 'gasto', fUrg: 'urgencia', fComp: 'comprador', fSol: 'solicitante' };
Object.keys(FMAP).concat(['fDesde', 'fHasta']).forEach(id => $('#' + id).addEventListener('change', aplicar));
$('#btnLimpiar').onclick = () => { Object.keys(FMAP).forEach(id => $('#' + id).value = ''); $('#fDesde').value = ''; $('#fHasta').value = ''; aplicar(); };

function aplicar() {
  llenarFiltros();
  const st = estadoFiltros();
  FILT = POS.filter(r => cumple(r, st));
  render();
}

/* ---------------------------- Pestañas ---------------------------- */
let TAB = ls.get(LS.tab) || 'resumen';
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { TAB = b.dataset.t; ls.set(LS.tab, TAB); render(); });
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === TAB));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('hide', s.dataset.p !== TAB));
  mostrarFiltros();
  if (!DATA) return;
  ({ resumen: pResumen, compras: pCompras, abast: pAbast, prov: pProv, inv: pInv, detalle: pDetalle, costos: pCostos, calidad: pCalidad })[TAB]();
}
const sec = id => document.querySelector(`section[data-p="${id}"]`);
const areasDe = m => MAT.get(String(m)) || [];
const deArea = (m, area) => !area || areasDe(m).includes(area);
/* Qué filtros globales aplican en cada pestaña */
const FILTROS_TAB = { inv: ['fArea'], costos: [], calidad: [] };
function mostrarFiltros() {
  const vis = FILTROS_TAB[TAB];
  const ids = Object.keys(FMAP).concat(['fDesde', 'fHasta']);
  $('#filters').classList.toggle('hide', vis !== undefined && vis.length === 0);
  ids.forEach(id => $('#' + id).closest('label').classList.toggle('hide', vis !== undefined && !vis.includes(id)));
  $('#fNota').textContent = TAB === 'inv' ? 'En Inventario solo aplica el Área: muestra los materiales que el área solicitó (ME5A) o consumió (MB51).' : '';
}

/* ---------------------------- Componentes ---------------------------- */
function kpi(lbl, val, det, cls, metaTxt) {
  return `<div class="card kpi ${cls || ''}"><div class="bar"></div>
    <div class="lbl"><span>${lbl}</span>${metaTxt ? `<span class="pill ${cls || ''}">${metaTxt}</span>` : ''}</div>
    <div class="val">${val}</div><div class="det">${det || ''}</div></div>`;
}
function card(id, titulo, nota, tall) {
  return `<div class="card"><h3>${titulo}</h3><p class="note">${nota || ''}</p><div class="chart ${tall ? 'tall' : ''}"><canvas id="${id}"></canvas></div></div>`;
}
function grafico(id, cfg) {
  if (charts[id]) charts[id].destroy();
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, animation: false,
    plugins: { legend: { labels: { boxWidth: 12, font: { size: 11 } } } } }, cfg.options || {});
  charts[id] = new Chart(el, cfg);
}
window.Chart && (Chart.defaults.font.family = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif', Chart.defaults.color = '#5b6475', Chart.defaults.borderColor = '#e9ecf1');

function tabla(cols, filas, opt = {}) {
  if (!filas.length) return `<div class="empty">Sin registros para los filtros actuales.</div>`;
  const th = cols.map(c => `<th class="${c.n ? 'n' : ''}">${c.t}</th>`).join('');
  const tr = filas.slice(0, opt.max || 500).map(r => '<tr>' + cols.map(c => {
    const v = c.f ? c.f(r) : esc(r[c.k]);
    return `<td class="${c.n ? 'n' : ''}">${v == null ? '' : v}</td>`;
  }).join('') + '</tr>').join('');
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
const mes = f => f ? f.slice(0, 7) : '';
const mesTxt = m => { const [y, mm] = m.split('-'); return ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'][+mm - 1] + '-' + y.slice(2); };

/* ---------------------------- Cálculo de KPIs ---------------------------- */
function kpis(a) {
  const conOC = a.filter(r => r.pedido);
  const abiertos = a.filter(r => r.estado !== 'ATENDIDO');
  const sinOC = a.filter(r => r.estado === 'SIN OC/OS');
  const mats = conOC.filter(r => r.tipo !== 'SERVICIO');
  const cantS = mats.reduce((t, r) => t + (+r.cant || 0), 0);
  const cantI = mats.reduce((t, r) => t + Math.min(+r.cantIng || 0, +r.cant || 0), 0);
  const at = vals(a, 'aTiempo');
  const urg = a.filter(r => r.urgencia === 'URGENTE');
  return {
    n: a.length, solped: new Set(a.map(r => r.solped)).size, oc: new Set(conOC.map(r => r.pedido)).size,
    valor: sum(a, 'valorPEN'),
    conv: a.length ? conOC.length / a.length : null,
    ltSO: med(vals(a, 'dSolOC')), ltSO90: p90(vals(a, 'dSolOC')),
    ltSOu: med(vals(urg, 'dSolOC')),
    ltOI: med(vals(a.filter(r => r.tipo !== 'SERVICIO'), 'dOCIng')), ltOI90: p90(vals(a.filter(r => r.tipo !== 'SERVICIO'), 'dOCIng')),
    ciclo: med(vals(a.filter(r => r.tipo !== 'SERVICIO'), 'dCiclo')),
    fill: cantS ? cantI / cantS : null,
    atendido: a.length ? a.filter(r => r.estado === 'ATENDIDO').length / a.length : null,
    abiertos: abiertos.length, valorAbierto: sum(abiertos, 'valorPEN'),
    sinOC: sinOC.length, sinOCviejos: sinOC.filter(r => r.antig > (M('META_BACKLOG_DIAS') || 15)).length,
    urg: a.length ? urg.length / a.length : null,
    aTiempo: at.length >= 20 ? at.reduce((x, y) => x + y, 0) / at.length : null, nAT: at.length >= 20 ? at.length : 0,
    alertStock: a.filter(r => r.alertaStock).length
  };
}

/* ============================ PROVEEDORES ============================ */
function pProv() {
  const s = sec('prov');
  const conP = FILT.filter(r => r.proveedor);
  if (!conP.length) {
    s.innerHTML = `<div class="alert info">Ninguna OC del filtro actual cruza con ME2N. Exporte ME2N con el mismo rango de fechas que ME5A para ver proveedores, valor de OC y tiempos de entrega por proveedor.</div>`;
    return;
  }
  const gp = [...groupBy(conP, 'proveedor')].map(([p, rs]) => {
    const oi = vals(rs.filter(r => r.tipo !== 'SERVICIO'), 'dOCIng');
    return { p, n: rs.length, oc: new Set(rs.map(r => r.pedido)).size, v: rs.reduce((t, r) => t + (r.valorOC || r.valorPEN || 0), 0), lt: med(oi), p90: p90(oi), ab: rs.filter(r => r.estado !== 'ATENDIDO').length };
  }).sort((a, b) => b.v - a.v);
  const tot = gp.reduce((t, x) => t + x.v, 0), top5 = gp.slice(0, 5).reduce((t, x) => t + x.v, 0);
  s.innerHTML = `
  <div class="grid k6">
    ${kpi('Proveedores', fN(gp.length), fN(new Set(conP.map(r => r.pedido)).size) + ' OC/OS cruzadas con ME2N')}
    ${kpi('Valor en OC', fS(tot), 'Valor neto ME2N')}
    ${kpi('Concentración top 5', fP(tot ? top5 / tot : null), gp.slice(0, 5).map(x => x.p.split(' ')[0]).join(', '), tot && top5 / tot > .8 ? 'warn' : '')}
    ${kpi('Cobertura del cruce', fP(conP.length / Math.max(1, FILT.filter(r => r.pedido).length)), 'posiciones con OC que están en ME2N', conP.length / Math.max(1, FILT.filter(r => r.pedido).length) < .9 ? 'warn' : 'good')}
  </div>

  if (!d) return '<div class="alert info" style="margin-top:14px">Actualice Codigo.gs y vuelva a procesar para ver el diagnóstico de cruces.</div>';
  const pc = x => x && x.oc ? x.ok / x.oc : null;
  const cm = pc(d.cruceMat), cs = pc(d.cruceServ), co = pc(d.cruceME2N);
  const R = {}; (d.rangos || []).forEach(r => R[r.fuente] = r);
  const ocIni = (R['ME5A (fecha OC)'] || {}).desde, ingIni = (R['MB51 ingresos'] || {}).desde;
  const m101 = ((d.mb51Mov || []).find(x => x.mov === 101) || {}).filas || 0;
  const rec = [];
  if (cm != null && cm < 0.8) {
    if (ocIni && ingIni && dias(ocIni, ingIni) > 30)
      rec.push(['bad', `<b>MB51 empieza tarde.</b> Los ingresos de MB51 empiezan el ${ingIni}, pero hay OC desde el ${ocIni}. Todas las OC anteriores quedan sin ingreso y salen «EN TRÁNSITO». Vuelva a extraer MB51 desde la misma fecha que ME5A.`]);
    else
      rec.push(['bad', `<b>MB51 incompleto.</b> Cubre el periodo, pero trae solo ${fN(m101)} filas de ingreso 101 para ${fN(d.cruceMat.oc)} posiciones de materiales con OC. Probable filtro en la extracción (almacén, material, usuario, grupo de artículos) o export cortado. Extraiga MB51 del centro PB03 sin filtros, solo por fecha y clases de movimiento.`]);
  }
  if (!d.me2nPorEntregar)
    rec.push(['warn', `<b>Agregue «Por entregar (cantidad)» al layout de ME2N.</b> Con esa columna el estado (ATENDIDO, PARCIAL, EN TRÁNSITO) se calcula desde ME2N para materiales <i>y servicios</i>; hoy solo ${fP(cs)} de los servicios tiene ingreso visible porque las hojas de entrada de servicio no generan movimiento 101.<br><b>Cómo:</b> en ME2N use Alcance de lista <code>ALV</code> → ejecutar → <i>Modificar disposición</i> (Ctrl+F8) → agregue «Por entregar (cantidad)» (o «Cantidad entregada») → guarde la disposición y expórtela así en cada carga. No hace falta cambiar el script: la reconoce automáticamente.`]);
  if (co != null && co < 0.9)
    rec.push(['warn', `<b>ME2N no cubre todas las OC de ME5A</b> (${fP(co)}). Extraiga ME2N con el mismo rango de fechas que ME5A para ver proveedores y valores de OC.`]);
  if (!rec.length) rec.push(['info', 'Los cruces entre transacciones están en niveles normales.']);
  setTimeout(() => {
    const t = d.cruceTri || [];
    grafico('chTri', { type: 'bar', data: { labels: t.map(x => x.tri), datasets: [{ label: '% con ingreso en MB51', data: t.map(x => +(x.ok / x.oc * 100).toFixed(1)), backgroundColor: t.map(x => x.ok / x.oc >= .8 ? '#1f8a4c' : x.ok / x.oc >= .5 ? '#d9a400' : '#c43c3c') }] },
      options: { plugins: { legend: { display: false }, tooltip: { callbacks: { afterLabel: c => fN(t[c.dataIndex].ok) + ' de ' + fN(t[c.dataIndex].oc) + ' posiciones' } } }, scales: { y: { min: 0, max: 100, ticks: { callback: v => v + '%' } } } } });
  }, 0);
  return `<div class="sec">Diagnóstico de cruces</div>
  <div class="grid k6">
    ${kpi('ME5A → ME2N', fP(co), fN(d.cruceME2N.ok) + ' de ' + fN(d.cruceME2N.oc) + ' posiciones con OC', semaforo(co, .9, true), 'meta ≥ 90%')}
    ${kpi('Materiales → ingreso MB51', fP(cm), fN(d.cruceMat.ok) + ' de ' + fN(d.cruceMat.oc), semaforo(cm, .85, true), 'meta ≥ 85%')}
    ${kpi('Servicios → ingreso', fP(cs), d.me2nPorEntregar ? 'estado desde ME2N «Por entregar»' : 'sin «Por entregar» en ME2N', d.me2nPorEntregar ? '' : 'warn')}
    ${kpi('Pedidos con ingreso en MB51', fN(d.pedidosMB51), fN(m101) + ' filas de mov. 101')}
  </div>
  <div class="card" style="margin-top:14px"><h3>Mejora recomendada</h3><p class="note">Generada a partir de los cruces de esta carga</p>
    ${rec.map(([c, t]) => `<div class="alert ${c === 'warn' ? '' : c}">${t}</div>`).join('')}</div>
  <div class="grid c3" style="margin-top:14px">
    <div class="card"><h3>Rango de fechas por fuente</h3><p class="note">Deben cubrir el mismo periodo</p>
    ${tabla([{ t: 'Fuente', k: 'fuente' }, { t: 'Desde', k: 'desde' }, { t: 'Hasta', k: 'hasta' }], d.rangos || [])}</div>
    ${card('chTri', 'Cruce con MB51 por trimestre de la OC', 'Materiales; verde ≥ 80%, rojo < 50%')}
    <div class="card"><h3>MB51 por clase de movimiento</h3><p class="note">Filas leídas</p>
    ${tabla([{ t: 'Clase', k: 'mov' }, { t: 'Filas', n: 1, f: r => fN(r.filas) }], d.mb51Mov || [])}</div>
  </div>`;
}
const dias = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
function pCalidad() {
  const s = sec('calidad'), f = META.fuentes || {};
  const gA = {}; POS.forEach(r => { if (r.area === 'SIN MAPEAR') { const u = r.solicitante || '(vacío)'; const x = gA[u] || (gA[u] = { u, n: 0, v: 0, ej: r.texto }); x.n++; x.v += r.valorPEN || 0; } });
  const sinA = Object.values(gA).sort((a, b) => b.n - a.n);
  const inc = POS.filter(r => r.inconsistente).sort((a, b) => a.fSol < b.fSol ? 1 : -1);
  s.innerHTML = `
  <div class="grid k6">
    ${['ME5A', 'ME2N', 'MB51', 'MB52', 'MM60'].map(t => kpi(t, fN(f[t] || 0), 'filas leídas', f[t] ? 'good' : 'bad')).join('')}
  </div>
  ${diagnosticoHtml()}
  <div class="sec">Advertencias del último proceso</div>
  <div class="card">${(META.advertencias || []).length ? META.advertencias.map(a => `<div class="alert">${esc(a)}</div>`).join('') : '<div class="empty">Sin advertencias.</div>'}</div>
  <div class="sec">Solicitantes sin área</div>
  <div class="grid c2">
    <div class="card"><h3>Agregar a MAESTRO_SOLICITANTES</h3><p class="note">${fN(sinA.length)} usuarios · ${fN(sinA.reduce((t, x) => t + x.n, 0))} posiciones aparecen como «SIN MAPEAR». Descargue la lista, complete el área y péguela en la hoja (o use el menú «Agregar usuarios sin área al maestro»).</p>
    <div class="tools"><button class="btn pri" id="csvSinArea">Descargar lista para completar</button></div>
    ${tabla([{ t: 'Usuario SAP', k: 'u' }, { t: 'Posiciones', n: 1, f: r => fN(r.n) }, { t: 'Valor', n: 1, f: r => fS(r.v) }, { t: 'Ejemplo de solicitud', f: r => esc(r.ej) }], sinA)}</div>
    <div class="card"><h3>Reglas aplicadas</h3><p class="note">Configurables en la hoja CONFIG</p>
    <table><tbody>
      <tr><td>Fecha de corte</td><td>${esc(META.fechaCorte)}</td></tr>
      <tr><td>SOLPED desde</td><td>${esc(META.fechaDesde)}</td></tr>
      <tr><td>Tipo de cambio USD</td><td>${esc(META.tipoCambio)}</td></tr>
      <tr><td>Ventana de consumo</td><td>${esc(META.ventanaConsumo)} días</td></tr>
      <tr><td>Sin movimiento</td><td>más de ${esc(META.diasLento)} días sin consumo</td></tr>
      <tr><td>Fechas inconsistentes</td><td>${fN(META.inconsistentes)} posiciones (excluidas de lead times)</td></tr>
      ${Object.entries(META.metas || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="sec">Posiciones con fechas inconsistentes</div>
  <div class="card"><h3>${fN(inc.length)} posiciones para corregir en SAP o revisar</h3><p class="note">Se excluyen de los lead times. Motivo: la OC tiene fecha anterior a la SOLPED, o el ingreso es anterior a la OC (suele ser una OC creada después de recibir el material).</p>
    <div class="tools"><button class="btn" id="csvInc">Descargar CSV</button></div>
    ${tabla([{ t: 'SOLPED', f: r => esc(r.solped) + '-' + r.pos }, { t: 'Fecha SOLPED', k: 'fSol' }, { t: 'OC/OS', f: r => esc(r.pedido) + '-' + esc(r.posPed) }, { t: 'Fecha OC', k: 'fOC' }, { t: 'Fecha ingreso', k: 'fIng' }, { t: 'Motivo', f: r => motivoInc(r) }, { t: 'Área', k: 'area' }, { t: 'Creado por', k: 'creadoPor' }, { t: 'Texto', k: 'texto' }], inc, { max: 300 })}</div>`;
  $('#csvSinArea').onclick = () => descargar('solicitantes_sin_area.csv', '\ufeffUsuario SAP;Área;Posiciones;Ejemplo\n' + sinA.map(x => [x.u, '', x.n, '"' + String(x.ej).replace(/"/g, '""') + '"'].join(';')).join('\n'), 'text/csv;charset=utf-8');
  $('#csvInc').onclick = () => descargar('fechas_inconsistentes.csv', '\ufeffSOLPED;Pos;Fecha SOLPED;OC;Pos OC;Fecha OC;Fecha ingreso;Motivo;Área;Creado por;Texto\n' +
    inc.map(r => [r.solped, r.pos, r.fSol, r.pedido, r.posPed, r.fOC, r.fIng, motivoInc(r), r.area, r.creadoPor, '"' + String(r.texto || '').replace(/"/g, '""') + '"'].join(';')).join('\n'), 'text/csv;charset=utf-8');
}
function motivoInc(r) {
  if (r.fOC && r.fOC < r.fSol) return 'OC antes de la SOLPED';
  if (r.fIng && r.fOC && r.fIng < r.fOC) return 'Ingreso antes de la OC';
  return 'Fecha inconsistente';
}

cargar(false);
</script>
</body>
